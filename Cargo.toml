[package]
name = "neurun"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Neurun Rust SDK: open a browser session and drive it."
readme = "README.md"
license = "Apache-2.0"
keywords = ["neurun", "browser", "session", "automation"]
categories = ["api-bindings", "web-programming"]

[dependencies]
prost = "0.14.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
